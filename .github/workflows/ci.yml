# Runs on every push and pull request (blueprint section 12).
# No secrets needed: the evaluation gate replays recorded model replies.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, eval gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invoiceiq
          POSTGRES_PASSWORD: invoiceiq
          POSTGRES_DB: invoiceiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoiceiq -d invoiceiq"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://invoiceiq:invoiceiq@localhost:5432/invoiceiq
      TEST_DATABASE_URL: postgresql+psycopg://invoiceiq:invoiceiq@localhost:5432/invoiceiq_test
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
      LLM_API_KEY: ""  # the gate must never call a real model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e "backend[dev,mcp]"

      - name: Lint
        run: |
          cd backend
          ruff check . ../scripts ../evals
          ruff format --check . ../scripts ../evals

      - name: Create the test database
        run: PGPASSWORD=invoiceiq psql -h localhost -U invoiceiq -c "CREATE DATABASE invoiceiq_test"

      - name: Tests
        run: cd backend && pytest -q

      - name: Evaluation gate (replayed model replies, test split)
        run: python -m evals.run --split test --gate

      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/latest-test-replay.*
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
