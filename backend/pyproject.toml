[project]
name = "invoiceiq"
version = "1.0.0"
description = "GST invoice intelligence agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.5",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "python-multipart==0.0.32",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "pymupdf==1.28.2",
    "fastembed==0.9.0",
    "langgraph==1.2.16",
    "sqlglot==30.23.0",
    "langfuse==5.0.2",
    "email-validator==2.3.0",
    "anthropic==1.15.0",
    "google-genai==2.31.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# The local MCP server (app/mcp_server.py); not needed by the deployed API.
mcp = ["mcp==2.3.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Noise from PyMuPDF's SWIG bindings, not from our code.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]
