# Render Blueprint: creates the backend as a free Docker web service.
# The database lives on Neon (free tier, pgvector included); paste its URL when Render asks.
services:
  - type: web
    name: invoiceiq-api
    runtime: docker
    plan: free
    region: singapore           # keep close to the Neon database region
    rootDir: backend            # only changes under backend/ trigger a redeploy
    # Render resolves these two paths relative to rootDir, not the repo root.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false             # Render asks for this once: the Neon connection string
      - key: ALLOWED_ORIGINS
        sync: false             # the Vercel URL of the frontend
      - key: JWT_SECRET
        generateValue: true     # Render creates a random 256-bit secret
      - key: STORAGE_BACKEND
        value: db               # Render's free disk is wiped on every restart
      - key: MAX_UPLOAD_MB
        value: "5"              # Neon's free tier has limited storage
      - key: LLM_PROVIDER
        value: gemini           # free tier; demo invoices only
      - key: LLM_API_KEY
        sync: false             # Gemini key from aistudio.google.com, set in the dashboard
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false             # e.g. https://cloud.langfuse.com or https://us.cloud.langfuse.com
